name: xiaosongshu-ocr

services:
  ocr:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${OCR_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim-bookworm}
        PIP_INDEX_URL: ${OCR_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${OCR_IMAGE:-xiaosongshu-ppocrv6:3.7.0}
    platform: ${OCR_PLATFORM:-linux/amd64}
    container_name: xiaosongshu-ocr
    environment:
      OCR_MODEL_DIR: /models
      OCR_DETECTION_MODEL_NAME: ${OCR_DETECTION_MODEL_NAME:-PP-OCRv6_medium_det}
      OCR_RECOGNITION_MODEL_NAME: ${OCR_RECOGNITION_MODEL_NAME:-PP-OCRv6_medium_rec}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-false}
      OCR_MAX_INPUT_BYTES: ${OCR_MAX_INPUT_BYTES:-52428800}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-5}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-180}
      OCR_PDF_MAX_SIDE: ${OCR_PDF_MAX_SIDE:-2400}
      OCR_MIN_SCORE: ${OCR_MIN_SCORE:-0.45}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${OCR_PORT:-8019}:8000'
    volumes:
      - '${OCR_MODEL_HOST_DIR:?Set OCR_MODEL_HOST_DIR to the PP-OCRv6 model parent directory}:/models:ro'
    shm_size: 1gb
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
